[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则-在线多国家低频自动测速版（3小时/次，含CloudflareCDN与双增强）
;参考: ACL4SSR_Online_Mini_NoAuto_CF.ini & ACL4SSR_Online_MultiCountry_CF.ini

;去广告：支持
;自动测速：支持（3小时/10800s）
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：支持
;增强国外GFW：支持
;多国家与线路分组：支持（美/新/日/韩/港/台/其它/电信）

;--------- 规则集 (ruleset) ---------
; 局域网与放行白名单
ruleset=🎯 全球直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/CFnat.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; 广告拦截
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list

; 谷歌商店与国内服务直连
ruleset=🚀 节点选择,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/PlayStore.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; 常用代理服务
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; 【增强国外GFW】
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; 国内域名与直连列表
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

; 【增强中国IP段】
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list

; Cloudflare CDN 分流
ruleset=☁️ CloudFlareCDN,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=☁️ CloudFlareCDN,[]GEOIP,cloudflare
ruleset=🎯 全球直连,[]GEOIP,CN

; 漏网之鱼兜底规则
ruleset=🐟 漏网之鱼,[]FINAL


;--------- 策略组 (custom_proxy_group) ---------
; 节点选择总控组（支持国家/线路自动测速分组、手动切换与直连）
custom_proxy_group=🚀 节点选择`select`[]📶 电信节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🌐 其它节点`[]☑️ 手动切换`[]DIRECT`

; 手动切换（展示所有节点）
custom_proxy_group=☑️ 手动切换`select`.*

; 多国家与线路节点分组（url-test 自动测速，每3小时/10800s 测速一次以控制请求量）
custom_proxy_group=📶 电信节点`url-test`(电信|三网|多线|三线)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇺🇲 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|USA|America|ATL|BUF|DFW|EWR|IAD|LAX|MCI|ORD|PHX|PDX|SEA|SJC)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇸🇬 狮城节点`url-test`(新加坡|坡|狮城|SG|Singapore|SIN)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|Tokyo|Osaka)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇰🇷 韩国节点`url-test`(KR|Korea|KOR|首尔|韩|韓|Seoul)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|HKG)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🇨🇳 台湾节点`url-test`(台|新北|彰化|TW|Taiwan|Taipei|台湾)`http://www.gstatic.com/generate_204`10800,,100
custom_proxy_group=🌐 其它节点`url-test`^(?!.*(电信|三网|多线|三线|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|USA|America|ATL|BUF|DFW|EWR|IAD|LAX|MCI|ORD|PHX|PDX|SEA|SJC|新加坡|坡|狮城|SG|Singapore|SIN|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|Tokyo|Osaka|KR|Korea|KOR|首尔|韩|韓|Seoul|港|HK|hk|Hong Kong|HongKong|HKG|台|新北|彰化|TW|Taiwan|Taipei|台湾)).*`http://www.gstatic.com/generate_204`10800,,100

; 全球直连与全球拦截
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]📶 电信节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🌐 其它节点`[]☑️ 手动切换`

; Cloudflare CDN 专用分组
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]📶 电信节点`[]🇺🇲 美国节点`[]🇸🇬 狮城节点`[]🇯🇵 日本节点`[]🇰🇷 韩国节点`[]🇭🇰 香港节点`[]🇨🇳 台湾节点`[]🌐 其它节点`[]☑️ 手动切换`

enable_rule_generator=true
overwrite_original_rules=true

; 清洗零宽字符（U+200B ~ U+200F, U+2060, U+FEFF）
rename=[\u200b-\u200f\u2060\ufeff]@
